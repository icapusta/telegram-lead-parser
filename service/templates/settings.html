<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Настройки парсера</title>
    <script>
      (function () {
        const key = "theme";
        const saved = localStorage.getItem(key);
        const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        const theme = saved || (prefersDark ? "dark" : "light");
        document.documentElement.dataset.theme = theme;
      })();
      function toggleTheme() {
        const key = "theme";
        const cur = document.documentElement.dataset.theme || "light";
        const next = cur === "dark" ? "light" : "dark";
        document.documentElement.dataset.theme = next;
        localStorage.setItem(key, next);
      }
      function esc(s) {
        return String(s ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }
      function selectedModels() {
        const boxes = Array.from(document.querySelectorAll("input[name='llm_model_pick']:checked"));
        return boxes.map((x) => x.value);
      }
      async function loadLLMModels() {
        const wrap = document.getElementById("llm-models-wrap");
        wrap.innerHTML = "<div class='hint'>Загрузка моделей...</div>";
        const r = await fetch("/api/llm/models");
        if (!r.ok) {
          wrap.innerHTML = "<div class='hint'>Не удалось загрузить модели</div>";
          return;
        }
        const data = await r.json();
        if (!Array.isArray(data) || data.length === 0) {
          wrap.innerHTML = "<div class='hint'>Cliapiproxy не вернул модели</div>";
          return;
        }
        const rows = data.map((m) => `
          <tr data-model-id="${esc(m.id)}">
            <td><input type="checkbox" name="llm_model_pick" value="${esc(m.id)}" ${m.in_priority ? "checked" : ""}></td>
            <td class="mono">${esc(m.id)}</td>
            <td>${esc(m.owned_by || "")}</td>
            <td>${m.allowed ? "<span class='ok'>разрешена</span>" : "<span class='bad'>заблокирована</span>"}</td>
            <td>${esc(m.block_reason || "")}</td>
            <td class="mono test-status">-</td>
            <td class="mono test-latency">-</td>
            <td class="mono test-limits">-</td>
            <td class="mono test-error">-</td>
            <td><button class="btn" type="button" onclick="testOneModel('${esc(m.id)}')">Тест</button></td>
          </tr>
        `).join("");
        wrap.innerHTML = `
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th></th>
                  <th>Модель</th>
                  <th>Провайдер</th>
                  <th>Политика</th>
                  <th>Причина</th>
                  <th>HTTP</th>
                  <th>Задержка</th>
                  <th>Лимиты</th>
                  <th>Ошибка</th>
                  <th>Действие</th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        `;
      }
      function applyTestResult(res) {
        const tr = document.querySelector(`tr[data-model-id="${CSS.escape(res.model_id || "")}"]`);
        if (!tr) return;
        tr.querySelector(".test-status").textContent = res.status_code || 0;
        tr.querySelector(".test-latency").textContent = (res.latency_ms || 0) + "мс";
        const lim = res.rate_limits || {};
        const limText = [
          lim["x-ratelimit-limit-requests"] ? `req:${lim["x-ratelimit-remaining-requests"] || "?"}/${lim["x-ratelimit-limit-requests"]}` : "",
          lim["x-ratelimit-limit-tokens"] ? `tok:${lim["x-ratelimit-remaining-tokens"] || "?"}/${lim["x-ratelimit-limit-tokens"]}` : "",
          lim["x-ratelimit-limit"] ? `gen:${lim["x-ratelimit-remaining"] || "?"}/${lim["x-ratelimit-limit"]}` : "",
          lim["retry-after"] ? `retry:${lim["retry-after"]}s` : "",
        ].filter(Boolean).join(" | ");
        tr.querySelector(".test-limits").textContent = limText || "-";
        tr.querySelector(".test-error").textContent = res.error || "-";
      }
      async function testOneModel(modelId) {
        const r = await fetch("/api/llm/test-model", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({model_id: modelId}),
        });
        if (!r.ok) return;
        const res = await r.json();
        applyTestResult(res);
      }
      async function testSelectedModels() {
        const models = selectedModels();
        if (!models.length) return;
        const r = await fetch("/api/llm/test-models", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({model_ids: models, limit: models.length}),
        });
        if (!r.ok) return;
        const data = await r.json();
        for (const res of (data.results || [])) applyTestResult(res);
      }
      async function testAllLoadedModels() {
        const models = Array.from(document.querySelectorAll("input[name='llm_model_pick']")).map((x) => x.value);
        if (!models.length) return;
        const r = await fetch("/api/llm/test-models", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({model_ids: models, limit: models.length}),
        });
        if (!r.ok) return;
        const data = await r.json();
        for (const res of (data.results || [])) applyTestResult(res);
      }
    </script>
    <style>
      :root {
        --bg: #0b0d10;
        --panel: #11151b;
        --text: #e7eef7;
        --muted: #9db0c4;
        --border: rgba(255,255,255,0.08);
        --accent: #58a6ff;
        --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Liberation Sans", sans-serif;
      }
      :root[data-theme="light"] {
        --bg: #f6f7fb;
        --panel: #ffffff;
        --text: #0f172a;
        --muted: #475569;
        --border: rgba(2, 6, 23, 0.10);
        --accent: #2563eb;
      }
      *, *::before, *::after { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); }
      .wrap { max-width: 1280px; margin: 24px auto; padding: 0 16px; }
      .top { display:flex; gap: 12px; align-items:center; justify-content:space-between; }
      .brand { display:flex; gap: 10px; align-items:baseline; }
      .brand h1 { margin: 0; font-size: 16px; letter-spacing: 0.2px; }
      .btn { border: 1px solid var(--border); background: var(--panel); color: var(--text); padding: 8px 10px; border-radius: 10px; cursor:pointer; font-size: 12px; }
      .head-actions { display:flex; gap:8px; align-items:center; flex-wrap: wrap; justify-content: flex-end; }
      .card { margin-top: 14px; border: 1px solid var(--border); background: var(--panel); border-radius: 14px; padding: 14px; }
      label { display:block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
      textarea { width: 100%; min-height: 160px; resize: vertical; border: 1px solid var(--border); background: transparent; color: var(--text); border-radius: 12px; padding: 10px; font-family: var(--mono); font-size: 12px; outline: none; }
      input[type="number"] { width:100%; border: 1px solid var(--border); background: transparent; color: var(--text); border-radius: 12px; padding: 10px; font-size:12px; outline:none; }
      .row { display:grid; grid-template-columns: repeat(2, minmax(320px, 1fr)); gap: 12px; }
      .row > div { min-width: 0; }
      .row.row-full { grid-template-columns: 1fr; }
      .toggles { display:flex; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; }
      .toggle { display:flex; align-items:center; gap: 8px; font-size: 12px; color: var(--text); }
      .hint { margin-top: 10px; color: var(--muted); font-size: 12px; line-height: 1.45; }
      .mono { font-family: var(--mono); }
      .save { margin-top: 12px; display:flex; gap: 10px; align-items:center; justify-content:flex-end; }
      input[type="checkbox"] { width: 16px; height: 16px; }
      .table-wrap { width:100%; overflow:auto; border: 1px solid var(--border); border-radius: 10px; margin-top: 10px; }
      table { width:100%; min-width:1100px; border-collapse: collapse; }
      th, td { padding: 8px; border-bottom: 1px solid var(--border); font-size:12px; text-align:left; vertical-align:top; }
      th { color: var(--muted); }
      .ok { color: #2ecc71; }
      .bad { color: #ff5c7a; }
      @media (max-width: 900px) {
        .top { align-items:flex-start; flex-direction: column; }
        .head-actions { justify-content: flex-start; }
        .row { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="top">
        <div class="brand">
          <h1>Настройки</h1>
        </div>
        <div class="head-actions">
          <a class="btn" href="/">Дашборд</a>
          <a class="btn" href="/discovery">Дискавери</a>
          <a class="btn" href="/discovery/targets">Найденные площадки</a>
          <button class="btn" onclick="toggleTheme()">Сменить тему</button>
        </div>
      </div>

      <div class="card">
        <form method="post" action="/settings">
          <div class="toggles">
            <label class="toggle"><input type="checkbox" name="keywords_enabled" value="true" {% if cfg.keywords_enabled %}checked{% endif %}/> Фильтр ключевых слов</label>
            <label class="toggle"><input type="checkbox" name="stopwords_enabled" value="true" {% if cfg.stopwords_enabled %}checked{% endif %}/> Фильтр стоп-слов</label>
            <label class="toggle"><input type="checkbox" name="llm_enabled" value="true" {% if cfg.llm_enabled %}checked{% endif %}/> LLM-классификация</label>
          </div>

          <div class="row">
            <div>
              <label>Ключевые слова (по одному на строку). Если фильтр включен и список не пустой, сообщение должно содержать хотя бы одно слово.</label>
              <textarea name="keywords_text" spellcheck="false">{{ cfg.keywords_text }}</textarea>
            </div>
            <div>
              <label>Стоп-слова (по одному на строку). Если фильтр включен и список не пустой, любое совпадение блокирует сообщение.</label>
              <textarea name="stopwords_text" spellcheck="false">{{ cfg.stopwords_text }}</textarea>
            </div>
          </div>

          <div class="row" style="margin-top:12px;">
            <div>
              <label>Приоритет моделей LLM (по одному id модели на строку).</label>
              <textarea name="llm_model_priority_text" spellcheck="false">{{ cfg.llm_model_priority_text }}</textarea>
            </div>
            <div>
              <label>Макс. попыток LLM (моделей на сообщение)</label>
              <input type="number" min="1" max="12" name="llm_max_attempts" value="{{ cfg.llm_max_attempts }}" />
              <label style="margin-top:10px;">Таймаут LLM (сек на запрос)</label>
              <input type="number" min="3" max="90" step="1" name="llm_timeout_s" value="{{ cfg.llm_timeout_s }}" />
              <div class="toggles" style="margin-top:12px;">
                <label class="toggle"><input type="checkbox" name="exclude_openai_owned_models" value="true" {% if cfg.exclude_openai_owned_models %}checked{% endif %}/> Исключать модели с owned_by=openai</label>
              </div>
              <div class="hint">Маршрутизация применяется к классификации лидов и авто-обновлению стоп-слов.</div>
            </div>
          </div>

          <div class="row row-full" style="margin-top:12px;">
            <div style="flex: 1 1 100%;">
              <label>Модели Cliapiproxy и проверка доступности</label>
              <div class="head-actions">
                <button class="btn" type="button" onclick="loadLLMModels()">Загрузить модели</button>
                <button class="btn" type="button" onclick="testSelectedModels()">Тест выбранных</button>
                <button class="btn" type="button" onclick="testAllLoadedModels()">Тест всех загруженных</button>
              </div>
              <div id="llm-models-wrap" class="hint">Нажми «Загрузить модели», чтобы получить полный список из Cliapiproxy.</div>
            </div>
          </div>

          <div class="save">
            <button class="btn" type="submit">Сохранить</button>
          </div>
        </form>

        <div class="hint">
          URL приёма сообщений: <span class="mono">{{ public_base_url }}/api/ingest/tg-monitor</span>
        </div>
      </div>
    </div>
  </body>
</html>
